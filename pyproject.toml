[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deconfounding-interp"
version = "0.1.0"
description = "Counterfactual baselines for contrastive activation extraction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "accelerate>=0.30",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "tqdm>=4.66",
  "transformers>=4.44",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]
viz = [
  "seaborn>=0.13",
]
api = [
  "anthropic>=0.34",
  "datasets>=3.0",
  "openai>=1.40",
]
runpod = [
  "vllm>=0.4",
  "vllm-lens>=0.1",
]

[project.scripts]
deconfound = "deconfounding_interp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deconfounding_interp = ["prompts/*.txt"]

# Lambda's A100 image exposes a CUDA 12.8 driver. Resolve the Linux torch
# wheel from the matching PyTorch index rather than PyPI's CUDA 13 build.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
  { index = "pypi", marker = "sys_platform != 'linux'" },
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
