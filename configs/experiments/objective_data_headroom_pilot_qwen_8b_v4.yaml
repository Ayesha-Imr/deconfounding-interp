id: objective_data_headroom_pilot_qwen_8b_v4
description: "Unsteered headroom smoke for the provenance-tagged objective-data candidate."
random_seed: 31

models:
  - models/qwen2_5_7b_instruct_objective_harder_pilot.yaml

traits:
  - traits/sycophancy.yaml
  - traits/hallucination.yaml

judge: judges/default_trait_judge.yaml
backend: huggingface

llm:
  provider: openai
  generation_model: gpt-4.1-mini-2025-04-14
  judge_model: gpt-4.1-mini-2025-04-14
  generation_temperature: 0.0
  generation_max_tokens: 128
  judge_concurrency: 1
  audit_csv: false
  prompt_asset_mode: deterministic

paths:
  data_dir: data
  raw_dir: data/raw/geometry_null_repair_8b
  interim_dir: data/interim/geometry_null_repair_8b
  processed_dir: data/processed/geometry_null_repair_8b
  manifest_dir: outputs/manifests/objective_data_headroom_pilot_qwen_8b_v4
  direction_dir: outputs/directions/geometry_null_repair_8b
  report_dir: outputs/reports/objective_data_headroom_pilot_qwen_8b_v4

generation:
  system_prompt_pairs: 1
  paraphrases_per_prompt: 0
  extraction_questions: 1
  evaluation_questions: 20
  rollouts_per_prompt_question: 1
  max_new_tokens: 128
  temperature: 0.0
  top_p: 1.0

scoring:
  mode: objective
  objective_tasks_path: data/objective_tasks_8b_data_candidate_v4.json

extraction:
  method: difference_in_means
  activation_position: response_average

surface_form:
  same_side_prompt_pairs: all_unique_pairs
  include_positive_side: true
  include_negative_side: true
  include_question_paraphrase_pairs: false

corrections:
  direction_types: [standard]
  surface_basis:
    max_rank: 3
    variance_threshold: 0.90

analysis:
  stability:
    within_trait_thresholds: {high: 0.90, moderate: 0.70}
    compare_to_cross_trait: true
  nulls:
    repeats: 10

steering:
  enabled: true
  scale_mode: activation_rms
  target_activation_rms_ratio: 0.05
  calibration_variant_indices: [0]
  alpha_values: [0.0]
  rollouts_per_eval_question: 2
  evaluate_cross_trait_leakage: false
