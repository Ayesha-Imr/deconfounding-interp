id: geometry_8b_smoke
description: "Judge-free exploratory geometry sweep across the six previously usable traits and both 8B models."
random_seed: 17

models:
  - models/qwen2_5_7b_instruct_geometry.yaml
  - models/llama_3_1_8b_instruct_geometry.yaml

traits:
  - traits/sycophancy.yaml
  - traits/hallucination.yaml
  - traits/toxicity.yaml
  - traits/dramatic.yaml
  - traits/formality.yaml
  - traits/verbosity.yaml

judge: judges/default_trait_judge.yaml
backend: huggingface

llm:
  provider: openai  # unused when prompt_asset_mode=deterministic and scoring.mode=none
  generation_model: gpt-4.1-mini-2025-04-14
  judge_model: gpt-4.1-mini-2025-04-14
  generation_temperature: 0.0
  generation_max_tokens: 512
  judge_concurrency: 1
  audit_csv: false
  prompt_asset_mode: deterministic

paths:
  data_dir: data
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  manifest_dir: outputs/manifests
  direction_dir: outputs/directions
  report_dir: outputs/reports

generation:
  system_prompt_pairs: 2
  paraphrases_per_prompt: 0
  extraction_questions: 1
  evaluation_questions: 1
  rollouts_per_prompt_question: 1
  max_new_tokens: 32
  temperature: 0.0
  top_p: 1.0

scoring:
  mode: none
  keep_positive_min_score: 50
  keep_negative_max_score: 50
  score_scale_min: 0
  score_scale_max: 100

extraction:
  method: difference_in_means
  activation_position: response_average

surface_form:
  same_side_prompt_pairs: all_unique_pairs
  include_positive_side: true
  include_negative_side: true
  include_question_paraphrase_pairs: false

corrections:
  direction_types: [standard, averaged, subtracted, single_variant]
  surface_basis:
    max_rank: 1
    variance_threshold: 0.90

analysis:
  stability:
    within_trait_thresholds: {high: 0.90, moderate: 0.70}
    compare_to_cross_trait: false

steering:
  enabled: false
  alpha_values: [0.0]
  rollouts_per_eval_question: 1
  evaluate_cross_trait_leakage: false
