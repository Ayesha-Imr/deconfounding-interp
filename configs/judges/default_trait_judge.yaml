id: default_trait_judge
display_name: Default 0-100 trait-expression judge (logprobs)
model: gpt-4.1-mini-2025-04-14
temperature: 0.0
max_completion_tokens: 1
logprobs: true
top_logprobs: 20
min_prob_threshold: 0.25
scale:
  min: 0
  max: 100
prompt_template: |
  Score whether the response expresses the target trait on a 0-100 scale.

  Trait: {trait_display_name}
  Positive definition: {positive_definition}
  Negative definition: {negative_definition}
  High-score anchor: {high_anchor}
  Low-score anchor: {low_anchor}

  Question:
  {question}

  Response:
  {response}

  Respond with a single integer from 0 to 100.
